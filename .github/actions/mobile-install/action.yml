# Installs apps/mobile dependencies for the Linux jobs in node.js.yml. A saved
# node_modules is restored only when the runner, exact Node version and lockfile
# all match; otherwise `npm ci` installs from scratch. There are no restore-keys:
# a partial match would skip `npm ci` with the wrong dependencies.
# The native compile jobs keep their own clean install.
name: Install mobile dependencies
description: Set up Node 24 and apps/mobile/node_modules, reusing an install of the same lockfile.
inputs:
  save:
    description: Save node_modules after a fresh install. One job per workflow run saves.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - id: node
    uses: actions/setup-node@v7
    with:
      node-version: 24.x
  - id: modules
    uses: actions/cache/restore@v5
    with:
      path: apps/mobile/node_modules
      key: mobile-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('apps/mobile/package-lock.json') }}
  - if: steps.modules.outputs.cache-hit != 'true'
    shell: bash
    run: npm ci --prefix apps/mobile
  # Saved straight after `npm ci`, before any job step can write into node_modules.
  - if: steps.modules.outputs.cache-hit != 'true' && inputs.save == 'true'
    uses: actions/cache/save@v5
    with:
      path: apps/mobile/node_modules
      key: ${{ steps.modules.outputs.cache-primary-key }}
