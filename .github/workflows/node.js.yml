# This workflow validates the active Expo clients (mobile and TV), shared core, reader and design packages.
# The deprecated apps/web client is checked separately by legacy-web.yml.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [ "main" ]

concurrency:
  # Supersede older runs for this PR or branch without cancelling unrelated PRs.
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
    # Fails when web.css is stale or a token color pair misses its contrast target.
    - run: npm run check --prefix packages/tarkman-design

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
    - uses: actions/checkout@v7
    # SDK 57 requires Node >=22.13; this matches the runtime the website deploys on.
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci
    - run: npm ls --all
    - run: npx expo-doctor
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run test:native-inputs
    # Shared core builds with mobile's locked TypeScript, so it needs no web install.
    - name: Shared core tests
      working-directory: .
      run: npm run core:test
    - name: Bundled lectionary integrity and consumer contract
      working-directory: .
      run: npm run lectionary:test
    - name: Pinned Python lectionary parity
      working-directory: .
      run: |
        curl -fL --retry 3 https://codeload.github.com/andylitalo/armenian-lectionary/tar.gz/38302406bce0f0dd7c4e09d3e20ba762c15a7418 -o "$RUNNER_TEMP/lectionary-source.tar.gz"
        node packages/tarkman-lectionary/scripts/dump-consumer.cjs > "$RUNNER_TEMP/lectionary-consumer.json"
        python3 packages/tarkman-lectionary/scripts/generate.py "$RUNNER_TEMP/lectionary-source.tar.gz" --check --consumer-results "$RUNNER_TEMP/lectionary-consumer.json"
    - run: npm run check:ui
    - run: npm run check:i18n
    - run: npm run check:fonts
    - run: npm run check:store-config
    - run: npm run config
    - run: npm run export:web
    # Generates the native iOS project so a broken app config or config plugin fails here
    # rather than during a release build. Runs last: prebuild rewrites package.json scripts.
    - name: iOS config smoke check
      run: |
        npx expo prebuild --platform ios --clean --no-install
        grep -q 'com.apple.developer.associated-domains' ios/Tarkman/Tarkman.entitlements
        grep -q 'applinks:web.tarkman.app' ios/Tarkman/Tarkman.entitlements
        grep -q 'app.tarkman' ios/Tarkman/Info.plist
        grep -q 'ITSAppUsesNonExemptEncryption' ios/Tarkman/Info.plist
        grep -q 'NSPrivacyAccessedAPICategoryDiskSpace' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategoryFileTimestamp' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategorySystemBootTime' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' ios/Tarkman/PrivacyInfo.xcprivacy

  ios-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      native: ${{ steps.changes.outputs.native }}
      requested: ${{ steps.changes.outputs.requested }}
      fingerprint: ${{ steps.changes.outputs.fingerprint }}
      compile: ${{ steps.reuse.outputs.compile }}
      reused-run: ${{ steps.reuse.outputs.reused-run }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history supports the PR merge-base diff, including fork PRs.
        fetch-depth: 0
        persist-credentials: false
    - name: Detect mobile-relevant changes
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        # The fingerprint covers the checked-out merge commit, so base updates count. The ISO
        # week bounds runner image and toolchain drift: opted-in builds refresh at least weekly.
        # The default shell has no pipefail; a failed script must fail detection, not empty its outputs.
        set -o pipefail
        node apps/mobile/scripts/native-inputs.mjs --platform ios \
          --base "$BASE_SHA" --head "$HEAD_SHA" --tree HEAD --title "$PR_TITLE" --salt "$(date -u +%G-W%V)" \
          | tee -a "$GITHUB_OUTPUT"
    # A marker is saved only by ios-build after a real ios-compile succeeded for this
    # fingerprint. PR caches are scoped to the PR, so a marker never crosses PRs.
    - name: Look up a prior iOS compile for these native inputs
      id: marker
      if: steps.changes.outputs.requested == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/native-compile-marker/ios.json
        key: native-compile-ok-ios-${{ steps.changes.outputs.fingerprint }}
    - name: Decide whether to compile
      id: reuse
      env:
        BUILD_REQUESTED: ${{ steps.changes.outputs.requested }}
        FINGERPRINT: ${{ steps.changes.outputs.fingerprint }}
        CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
        MARKER: ${{ runner.temp }}/native-compile-marker/ios.json
      run: |
        compile=false
        if [ "$BUILD_REQUESTED" = true ]; then
          compile=true
          # Fail closed: any missing, unreadable or mismatched marker means compile again.
          if [ "$CACHE_HIT" = true ] && [ -f "$MARKER" ] && \
             jq -e --arg fp "$FINGERPRINT" '.platform == "ios" and .result == "success" and .fingerprint == $fp' "$MARKER" > /dev/null; then
            compile=false
            run_url=$(jq -r '.run_url' "$MARKER")
            echo "reused-run=$run_url" >> "$GITHUB_OUTPUT"
            echo "Native inputs match a successful iOS compile: $run_url (head $(jq -r '.head_sha' "$MARKER"))."
          else
            echo "No verified iOS compile for native fingerprint $FINGERPRINT; compiling."
          fi
        else
          echo "Native compile not requested; add [native-build] to the PR title to enable it."
        fi
        echo "compile=$compile" >> "$GITHUB_OUTPUT"

  ios-bundle-smoke:
    needs: ios-changes
    if: needs.ios-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci --prefix apps/mobile
    - name: Export iOS JavaScript bundle
      working-directory: apps/mobile
      run: npx expo export --platform ios --clear --output-dir "$RUNNER_TEMP/tarkman-ios-bundle"

  ios-compile:
    needs: ios-changes
    if: needs.ios-changes.outputs.compile == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      toolchain: ${{ steps.toolchain.outputs.toolchain }}
    env:
      CI: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_DOTENV: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci --prefix apps/mobile
    - name: Clean iOS prebuild
      working-directory: apps/mobile
      run: npx expo prebuild --platform ios --clean --no-install
    - name: Install iOS pods
      working-directory: apps/mobile/ios
      run: pod install
    - name: Compile unsigned iOS simulator app
      working-directory: apps/mobile
      run: |
        xcodebuild -version
        xcodebuild -workspace ios/Tarkman.xcworkspace -scheme Tarkman \
          -configuration Debug -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/tarkman-ios-build" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
    - name: Record toolchain
      id: toolchain
      run: echo "toolchain=$ImageOS $ImageVersion; $(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  # Require this stable check, not the conditional macOS job.
  ios-build:
    name: ios-build
    needs: [ios-changes, ios-bundle-smoke, ios-compile]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Verify iOS compile outcome
      env:
        CHANGES_RESULT: ${{ needs.ios-changes.result }}
        MOBILE_CHANGED: ${{ needs.ios-changes.outputs.mobile }}
        BUILD_REQUESTED: ${{ needs.ios-changes.outputs.requested }}
        COMPILE_NEEDED: ${{ needs.ios-changes.outputs.compile }}
        REUSED_RUN: ${{ needs.ios-changes.outputs.reused-run }}
        BUNDLE_RESULT: ${{ needs.ios-bundle-smoke.result }}
        COMPILE_RESULT: ${{ needs.ios-compile.result }}
      run: |
        if [ "$CHANGES_RESULT" != success ]; then
          echo "Mobile change detection did not succeed."
          exit 1
        fi
        if [ "$MOBILE_CHANGED" = false ] && [ "$BUILD_REQUESTED" = false ] && [ "$COMPILE_NEEDED" = false ] && \
           [ "$BUNDLE_RESULT" = skipped ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "No mobile-relevant changes; iOS validation intentionally skipped."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = false ] && [ "$COMPILE_NEEDED" = false ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "Linux iOS JavaScript bundle smoke check succeeded; native compile not requested (enable with [native-build] in the PR title)."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = true ] && [ "$COMPILE_NEEDED" = true ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = success ]; then
          echo "Linux iOS bundle smoke check and unsigned iOS simulator compile succeeded."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = true ] && [ "$COMPILE_NEEDED" = false ] && \
             [ -n "$REUSED_RUN" ] && [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "iOS bundle smoke check succeeded; native inputs are identical to the successful compile in $REUSED_RUN."
        else
          echo "Unexpected iOS validation outcomes: mobile=$MOBILE_CHANGED requested=$BUILD_REQUESTED compile-needed=$COMPILE_NEEDED bundle=$BUNDLE_RESULT compile=$COMPILE_RESULT."
          exit 1
        fi
    - name: Write the iOS compile marker
      if: needs.ios-compile.result == 'success'
      env:
        FINGERPRINT: ${{ needs.ios-changes.outputs.fingerprint }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLCHAIN: ${{ needs.ios-compile.outputs.toolchain }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: |
        test -n "$FINGERPRINT"
        mkdir -p "$RUNNER_TEMP/native-compile-marker"
        jq -n --arg fp "$FINGERPRINT" --arg head "$HEAD_SHA" --arg toolchain "$TOOLCHAIN" --arg url "$RUN_URL" \
          '{platform: "ios", result: "success", fingerprint: $fp, head_sha: $head, toolchain: $toolchain, run_url: $url}' \
          | tee "$RUNNER_TEMP/native-compile-marker/ios.json"
    - name: Save the iOS compile marker
      if: needs.ios-compile.result == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/native-compile-marker/ios.json
        key: native-compile-ok-ios-${{ needs.ios-changes.outputs.fingerprint }}

  android-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      native: ${{ steps.changes.outputs.native }}
      requested: ${{ steps.changes.outputs.requested }}
      fingerprint: ${{ steps.changes.outputs.fingerprint }}
      compile: ${{ steps.reuse.outputs.compile }}
      reused-run: ${{ steps.reuse.outputs.reused-run }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history supports the PR merge-base diff, including fork PRs.
        fetch-depth: 0
        persist-credentials: false
    - name: Detect mobile-relevant changes
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        # The fingerprint covers the checked-out merge commit, so base updates count. The ISO
        # week bounds runner image and toolchain drift: opted-in builds refresh at least weekly.
        # The default shell has no pipefail; a failed script must fail detection, not empty its outputs.
        set -o pipefail
        node apps/mobile/scripts/native-inputs.mjs --platform android \
          --base "$BASE_SHA" --head "$HEAD_SHA" --tree HEAD --title "$PR_TITLE" --salt "$(date -u +%G-W%V)" \
          | tee -a "$GITHUB_OUTPUT"
    # A marker is saved only by android-build after a real android-compile succeeded for this
    # fingerprint. PR caches are scoped to the PR, so a marker never crosses PRs.
    - name: Look up a prior Android compile for these native inputs
      id: marker
      if: steps.changes.outputs.requested == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/native-compile-marker/android.json
        key: native-compile-ok-android-${{ steps.changes.outputs.fingerprint }}
    - name: Decide whether to compile
      id: reuse
      env:
        BUILD_REQUESTED: ${{ steps.changes.outputs.requested }}
        FINGERPRINT: ${{ steps.changes.outputs.fingerprint }}
        CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
        MARKER: ${{ runner.temp }}/native-compile-marker/android.json
      run: |
        compile=false
        if [ "$BUILD_REQUESTED" = true ]; then
          compile=true
          # Fail closed: any missing, unreadable or mismatched marker means compile again.
          if [ "$CACHE_HIT" = true ] && [ -f "$MARKER" ] && \
             jq -e --arg fp "$FINGERPRINT" '.platform == "android" and .result == "success" and .fingerprint == $fp' "$MARKER" > /dev/null; then
            compile=false
            run_url=$(jq -r '.run_url' "$MARKER")
            echo "reused-run=$run_url" >> "$GITHUB_OUTPUT"
            echo "Native inputs match a successful Android compile: $run_url (head $(jq -r '.head_sha' "$MARKER"))."
          else
            echo "No verified Android compile for native fingerprint $FINGERPRINT; compiling."
          fi
        else
          echo "Native compile not requested; add [native-build] to the PR title to enable it."
        fi
        echo "compile=$compile" >> "$GITHUB_OUTPUT"

  android-bundle-smoke:
    needs: android-changes
    if: needs.android-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci --prefix apps/mobile
    - name: Export Android JavaScript bundle
      working-directory: apps/mobile
      run: npx expo export --platform android --clear --output-dir "$RUNNER_TEMP/tarkman-android-bundle"

  android-compile:
    needs: android-changes
    if: needs.android-changes.outputs.compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      toolchain: ${{ steps.toolchain.outputs.toolchain }}
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    # React Native 0.86's Gradle build targets JDK 17.
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - run: npm ci --prefix apps/mobile
    - name: Clean Android prebuild
      working-directory: apps/mobile
      run: npx expo prebuild --platform android --clean --no-install
    - name: Check the merged release manifest
      working-directory: apps/mobile/android
      run: |
        ./gradlew :app:processReleaseManifest --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        # The final merged manifest, after library manifests and tools:node="remove" are applied.
        manifest=$(find app/build/intermediates/merged_manifests -path '*release*' -name AndroidManifest.xml | head -n 1)
        test -n "$manifest"
        echo "Merged release manifest: $manifest"
        grep -q 'package="app.tarkman"' "$manifest"
        grep -q 'android.permission.CAMERA' "$manifest"
        grep -q 'android:scheme="tarkman"' "$manifest"
        for blocked in RECORD_AUDIO ACCESS_BACKGROUND_LOCATION READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW; do
          if grep -q "android.permission.$blocked\"" "$manifest"; then
            echo "Unexpected permission in release manifest: $blocked"
            exit 1
          fi
        done
        if grep -q 'android:debuggable="true"' "$manifest"; then
          echo "Release manifest is debuggable."
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/android-evidence"
        cp "$manifest" "$RUNNER_TEMP/android-evidence/release-AndroidManifest.xml"
        grep -o 'android.permission[.A-Z_a-z]*' "$manifest" | sort -u | tee "$RUNNER_TEMP/android-evidence/release-permissions.txt"
    - name: Compile debug APK
      working-directory: apps/mobile/android
      run: |
        java -version
        ./gradlew --version
        # One ABI proves every native module compiles and links while keeping the job short.
        ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        apk=app/build/outputs/apk/debug/app-debug.apk
        test -f "$apk"
        aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
        "$aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission):" \
          | tee "$RUNNER_TEMP/android-evidence/debug-apk-badging.txt"
    - name: Record toolchain
      id: toolchain
      run: echo "toolchain=$ImageOS $ImageVersion; $(java -version 2>&1 | head -n 1)" >> "$GITHUB_OUTPUT"
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: android-compile-evidence
        path: ${{ runner.temp }}/android-evidence
        retention-days: 14

  # Require this stable check, not the conditional compile job.
  android-build:
    name: android-build
    needs: [android-changes, android-bundle-smoke, android-compile]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Verify Android compile outcome
      env:
        CHANGES_RESULT: ${{ needs.android-changes.result }}
        MOBILE_CHANGED: ${{ needs.android-changes.outputs.mobile }}
        BUILD_REQUESTED: ${{ needs.android-changes.outputs.requested }}
        COMPILE_NEEDED: ${{ needs.android-changes.outputs.compile }}
        REUSED_RUN: ${{ needs.android-changes.outputs.reused-run }}
        BUNDLE_RESULT: ${{ needs.android-bundle-smoke.result }}
        COMPILE_RESULT: ${{ needs.android-compile.result }}
      run: |
        if [ "$CHANGES_RESULT" != success ]; then
          echo "Mobile change detection did not succeed."
          exit 1
        fi
        if [ "$MOBILE_CHANGED" = false ] && [ "$BUILD_REQUESTED" = false ] && [ "$COMPILE_NEEDED" = false ] && \
           [ "$BUNDLE_RESULT" = skipped ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "No mobile-relevant changes; Android validation intentionally skipped."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = false ] && [ "$COMPILE_NEEDED" = false ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "Android JavaScript bundle smoke check succeeded; native compile not requested (enable with [native-build] in the PR title)."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = true ] && [ "$COMPILE_NEEDED" = true ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = success ]; then
          echo "Android bundle smoke check, release manifest check and debug APK compile succeeded."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$BUILD_REQUESTED" = true ] && [ "$COMPILE_NEEDED" = false ] && \
             [ -n "$REUSED_RUN" ] && [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "Android bundle smoke check succeeded; native inputs are identical to the successful compile in $REUSED_RUN."
        else
          echo "Unexpected Android validation outcomes: mobile=$MOBILE_CHANGED requested=$BUILD_REQUESTED compile-needed=$COMPILE_NEEDED bundle=$BUNDLE_RESULT compile=$COMPILE_RESULT."
          exit 1
        fi
    - name: Write the Android compile marker
      if: needs.android-compile.result == 'success'
      env:
        FINGERPRINT: ${{ needs.android-changes.outputs.fingerprint }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLCHAIN: ${{ needs.android-compile.outputs.toolchain }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: |
        test -n "$FINGERPRINT"
        mkdir -p "$RUNNER_TEMP/native-compile-marker"
        jq -n --arg fp "$FINGERPRINT" --arg head "$HEAD_SHA" --arg toolchain "$TOOLCHAIN" --arg url "$RUN_URL" \
          '{platform: "android", result: "success", fingerprint: $fp, head_sha: $head, toolchain: $toolchain, run_url: $url}' \
          | tee "$RUNNER_TEMP/native-compile-marker/android.json"
    - name: Save the Android compile marker
      if: needs.android-compile.result == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/native-compile-marker/android.json
        key: native-compile-ok-android-${{ needs.android-changes.outputs.fingerprint }}

  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      requested: ${{ steps.request.outputs.requested }}
    defaults:
      run:
        working-directory: apps/tv
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/tv/package-lock.json
    # The same [native-build] PR title tag that opts mobile into native compiles also requests tv-compile.
    - name: Read the native build request
      id: request
      working-directory: .
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        node --input-type=module -e "import { nativeBuildRequested } from './apps/mobile/scripts/native-inputs.mjs'; console.log('requested=' + nativeBuildRequested(process.env.PR_TITLE))" | tee -a "$GITHUB_OUTPUT"
    - run: npm ci
    - run: npm ls --all
    - run: npx expo-doctor
    # Exactly one react-native install (the fork), matching mobile's React Native and React.
    - run: npm run check:runtime
    - run: npm run check:identity
    # Embedded reading fonts must stay byte-identical to mobile's.
    - run: npm run check:fonts
    - run: npm run lint
    - run: npm run typecheck
    # Includes the synthetic end-to-end reader flow, which asserts the TV only reads.
    - run: npm test
    - name: Shared reader boundary and Metro guard
      working-directory: .
      run: npm run reader:check && npm run metro:test
    # The Metro guard fails this export if react/react-native resolve outside apps/tv/node_modules.
    - name: Export tvOS JavaScript bundle
      run: |
        npm run export:tvos -- --clear --no-bytecode --output-dir "$RUNNER_TEMP/tarkman-tv-bundle"
        grep -q TVFocusGuideView "$RUNNER_TEMP"/tarkman-tv-bundle/_expo/static/js/ios/*.js
    - name: tvOS config smoke check
      run: |
        npm run prebuild:tvos -- --no-install
        grep -q 'SDKROOT = appletvos' ios/Tarkman.xcodeproj/project.pbxproj
        grep -q 'TARGETED_DEVICE_FAMILY = 3' ios/Tarkman.xcodeproj/project.pbxproj
        grep -q 'platform :tvos' ios/Podfile
        grep -q 'app.tarkman' ios/Tarkman.xcodeproj/project.pbxproj
        # tvOS 27 SDK apps without a scene manifest trap at launch (plugins/withSceneLifecycle.js).
        grep -q 'UIApplicationSceneManifest' ios/Tarkman/Info.plist
        grep -q 'SceneDelegate.swift in Sources' ios/Tarkman.xcodeproj/project.pbxproj

  # Unsigned tvOS simulator compile, opt-in with [native-build] in the PR title (like ios-compile).
  # Signed device and App Store builds belong to the release workflow in apps/tv/README.md, not CI.
  tv-compile:
    needs: tv
    if: needs.tv.outputs.requested == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/tv/package-lock.json
    - run: npm ci --prefix apps/tv
    - name: Clean tvOS prebuild
      working-directory: apps/tv
      run: npm run prebuild:tvos -- --no-install
    - name: Install tvOS pods
      working-directory: apps/tv/ios
      run: pod install
    - name: Compile unsigned tvOS simulator app
      working-directory: apps/tv
      run: |
        xcodebuild -version
        xcodebuild -workspace ios/Tarkman.xcworkspace -scheme Tarkman \
          -configuration Debug -sdk appletvsimulator \
          -destination 'generic/platform=tvOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/tarkman-tv-build" \
          EXPO_TV=1 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # Require this stable check, not the conditional macOS job.
  tv-build:
    name: tv-build
    needs: [tv, tv-compile]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Verify tvOS compile outcome
      env:
        TV_RESULT: ${{ needs.tv.result }}
        BUILD_REQUESTED: ${{ needs.tv.outputs.requested }}
        COMPILE_RESULT: ${{ needs.tv-compile.result }}
      run: |
        if [ "$TV_RESULT" != success ]; then
          echo "TV validation did not succeed."
          exit 1
        fi
        if [ "$BUILD_REQUESTED" = false ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "TV checks, tvOS bundle and prebuild succeeded; native compile not requested (enable with [native-build] in the PR title)."
        elif [ "$BUILD_REQUESTED" = true ] && [ "$COMPILE_RESULT" = success ]; then
          echo "TV checks and unsigned tvOS simulator compile succeeded."
        else
          echo "Unexpected tvOS validation outcomes: tv=$TV_RESULT requested=$BUILD_REQUESTED compile=$COMPILE_RESULT."
          exit 1
        fi
