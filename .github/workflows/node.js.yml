# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
    - name: Run tests
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_TEST_EMAIL: ${{ secrets.VITE_TEST_EMAIL }}
        VITE_TEST_PASSWORD: ${{ secrets.VITE_TEST_PASSWORD }}
      run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
    - uses: actions/checkout@v4
    # SDK 57 requires Node >=22.13; the web matrix/runtime stays under #68.
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci
    - run: npm ls --all
    - run: npx expo-doctor
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run check:ui
    - run: npm run check:fonts
    - run: npm run config
    - run: npm run export:web
    # Generates the native iOS project so a broken app config or config plugin fails here
    # rather than during a release build. Runs last: prebuild rewrites package.json scripts.
    - name: iOS config smoke check
      run: |
        npx expo prebuild --platform ios --clean --no-install
        grep -q 'com.apple.developer.associated-domains' ios/Tarkman/Tarkman.entitlements
        grep -q 'applinks:web.tarkman.app' ios/Tarkman/Tarkman.entitlements
        grep -q 'app.tarkman' ios/Tarkman/Info.plist
