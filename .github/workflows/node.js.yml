# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # Supersede older runs for this PR or branch without cancelling unrelated PRs.
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Legacy Vite app (apps/web, deprecated since #177). The job keeps the name "build"
  # because branch protection requires its checks; remove it together with apps/web.
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    strategy:
      matrix:
        # Node 24 is what Vercel runs; 22 is the previous LTS still supported locally.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
    - name: Run tests
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_TEST_EMAIL: ${{ secrets.VITE_TEST_EMAIL }}
        VITE_TEST_PASSWORD: ${{ secrets.VITE_TEST_PASSWORD }}
      run: npm test

  design:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
    # Fails when web.css is stale or a token color pair misses its contrast target.
    - run: npm run check --prefix packages/tarkman-design

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
    - uses: actions/checkout@v7
    # SDK 57 requires Node >=22.13; this matches the runtime the website deploys on.
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci
    - run: npm ls --all
    - run: npx expo-doctor
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run check:ui
    - run: npm run check:i18n
    - run: npm run check:fonts
    - run: npm run check:store-config
    - run: npm run config
    - run: npm run export:web
    # Generates the native iOS project so a broken app config or config plugin fails here
    # rather than during a release build. Runs last: prebuild rewrites package.json scripts.
    - name: iOS config smoke check
      run: |
        npx expo prebuild --platform ios --clean --no-install
        grep -q 'com.apple.developer.associated-domains' ios/Tarkman/Tarkman.entitlements
        grep -q 'applinks:web.tarkman.app' ios/Tarkman/Tarkman.entitlements
        grep -q 'app.tarkman' ios/Tarkman/Info.plist
        grep -q 'ITSAppUsesNonExemptEncryption' ios/Tarkman/Info.plist
        grep -q 'NSPrivacyAccessedAPICategoryDiskSpace' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategoryFileTimestamp' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategorySystemBootTime' ios/Tarkman/PrivacyInfo.xcprivacy
        grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' ios/Tarkman/PrivacyInfo.xcprivacy

  ios-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      native: ${{ steps.changes.outputs.native }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history supports the PR merge-base diff, including fork PRs.
        fetch-depth: 0
        persist-credentials: false
    - name: Detect mobile-relevant changes
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Disable rename detection so moving a file out of mobile still builds.
        # Git pathspecs avoid API pagination and changed-file count limits.
        git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" -- \
          apps/mobile/ packages/tarkman-core/ packages/tarkman-design/ \
          .github/workflows/node.js.yml > "$RUNNER_TEMP/ios-changes.txt"
        if [ -s "$RUNNER_TEMP/ios-changes.txt" ]; then
          echo "mobile=true" >> "$GITHUB_OUTPUT"
        else
          echo "mobile=false" >> "$GITHUB_OUTPUT"
        fi

        native=false
        while IFS= read -r path; do
          case "$path" in
            .github/workflows/node.js.yml|\
            apps/mobile/app.json|apps/mobile/app.config.*|apps/mobile/eas.json|apps/mobile/.easignore|\
            apps/mobile/package.json|apps/mobile/package-lock.json|apps/mobile/npm-shrinkwrap.json|\
            apps/mobile/ios/*|apps/mobile/plugins/*|apps/mobile/config-plugins/*|\
            apps/mobile/app.plugin.*|apps/mobile/assets/icons/*)
              native=true
              break
              ;;
          esac
        done < "$RUNNER_TEMP/ios-changes.txt"
        echo "native=$native" >> "$GITHUB_OUTPUT"

  ios-bundle-smoke:
    needs: ios-changes
    if: needs.ios-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://reader.invalid
      EXPO_PUBLIC_ACTIONCABLE_URL: wss://reader.invalid/cable
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci --prefix apps/mobile
    - name: Export iOS JavaScript bundle
      working-directory: apps/mobile
      run: npx expo export --platform ios --clear --output-dir "$RUNNER_TEMP/tarkman-ios-bundle"

  ios-compile:
    needs: ios-changes
    if: needs.ios-changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_DOTENV: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: apps/mobile/package-lock.json
    - run: npm ci --prefix apps/mobile
    - name: Clean iOS prebuild
      working-directory: apps/mobile
      run: npx expo prebuild --platform ios --clean --no-install
    - name: Install iOS pods
      working-directory: apps/mobile/ios
      run: pod install
    - name: Compile unsigned iOS simulator app
      working-directory: apps/mobile
      run: |
        xcodebuild -version
        xcodebuild -workspace ios/Tarkman.xcworkspace -scheme Tarkman \
          -configuration Debug -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/tarkman-ios-build" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # Require this stable check, not the conditional macOS job.
  ios-build:
    name: ios-build
    needs: [ios-changes, ios-bundle-smoke, ios-compile]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Verify iOS compile outcome
      env:
        CHANGES_RESULT: ${{ needs.ios-changes.result }}
        MOBILE_CHANGED: ${{ needs.ios-changes.outputs.mobile }}
        NATIVE_CHANGED: ${{ needs.ios-changes.outputs.native }}
        BUNDLE_RESULT: ${{ needs.ios-bundle-smoke.result }}
        COMPILE_RESULT: ${{ needs.ios-compile.result }}
      run: |
        if [ "$CHANGES_RESULT" != success ]; then
          echo "Mobile change detection did not succeed."
          exit 1
        fi
        if [ "$MOBILE_CHANGED" = false ] && [ "$NATIVE_CHANGED" = false ] && \
           [ "$BUNDLE_RESULT" = skipped ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "No mobile-relevant changes; iOS validation intentionally skipped."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$NATIVE_CHANGED" = false ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = skipped ]; then
          echo "Linux iOS JavaScript bundle smoke check succeeded; no native compile needed."
        elif [ "$MOBILE_CHANGED" = true ] && [ "$NATIVE_CHANGED" = true ] && \
             [ "$BUNDLE_RESULT" = success ] && [ "$COMPILE_RESULT" = success ]; then
          echo "Linux iOS bundle smoke check and unsigned iOS simulator compile succeeded."
        else
          echo "Unexpected iOS validation outcomes: mobile=$MOBILE_CHANGED native=$NATIVE_CHANGED bundle=$BUNDLE_RESULT compile=$COMPILE_RESULT."
          exit 1
        fi
