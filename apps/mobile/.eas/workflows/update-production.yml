name: Publish iOS production update

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        description: Describe the reviewed JavaScript or asset change
        required: true

jobs:
  update_production:
    type: update
    environment: production
    params:
      platform: ios
      channel: production
      message: ${{ inputs.message }}
      upload_sentry_sourcemaps: true
