# A reader switches the fixture service between English and Classical Armenian
# and back; the reading text follows the choice. Signed out and read-only,
# against qa/design-system/mock-reader-server.cjs.
appId: app.tarkman
name: Switch reading languages
---
- runFlow: fixture-open-service.yaml
- assertVisible: "(?s)Our Father.*"
- tapOn:
    id: "reader-language"
- extendedWaitUntil:
    visible: "Reading language"
    timeout: 15000
- tapOn: "Գրաբար"
- extendedWaitUntil:
    visible: "(?s)Հայր մեր.*"
    timeout: 15000
- tapOn:
    id: "reader-language"
- extendedWaitUntil:
    visible: "Reading language"
    timeout: 15000
- tapOn: "English"
- extendedWaitUntil:
    visible: "(?s)Our Father.*"
    timeout: 15000
