# Run against the local fixture. Replay is explicit and works even after a prior tour.
appId: app.tarkman
name: Replay reading controls with real sheets
---
- runFlow: fixture-open-service.yaml
- tapOn:
    id: reader-preferences
- assertVisible: "Appearance"
- tapOn:
    text: "Tour reading controls|Resume tour"
- assertVisible: "Step 1 of 4|Step 2 of 4|Step 3 of 4|Step 4 of 4"
- tapOn: "End tour"
- tapOn:
    id: reader-preferences
- tapOn: "Tour reading controls"
- assertVisible: "Step 1 of 4"
- tapOn: "Next"
- assertVisible: "Step 2 of 4"
- tapOn: "Open language choices"
- assertVisible: "Reading language"
- tapOn: "Close Reading language"
- assertVisible: "Step 2 of 4"
- tapOn: "Next"
- assertVisible: "Step 3 of 4"
- tapOn: "Next"
- assertVisible: "Step 4 of 4"
- tapOn: "Open reading preferences"
- assertVisible: "Appearance"
- tapOn: "Close Reading preferences"
- assertVisible: "Step 4 of 4"
- tapOn: "Finish"
- assertNotVisible: "Step 4 of 4"
