# Loads the app. Development builds must be pointed at Metro; a standalone build
# ignores the link and simply launches, so the same flows run against both.
appId: app.tarkman
---
- launchApp:
    clearState: false
- openLink:
    # The development-client Tools button overlaps Today's scan control on iPhone.
    link: exp+tarkman://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&disableFab=1
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 60000
