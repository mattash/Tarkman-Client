# A reader opens a service by its ID, changes language, and reads one part in full.
# Signed out and read-only: nothing here can change a live service.
appId: app.tarkman
name: Read a service and open a part
---
- runFlow: launch.yaml
- tapOn:
    id: "session-id"
- inputText: "4006"
# The numeric keypad covers the button, so submit with its Go key, which is what the
# field's return key is configured to do.
- tapOn: "Go"
- extendedWaitUntil:
    visible: "All services"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Choose reading language"
- extendedWaitUntil:
    visible: "Reading language"
    timeout: 15000
- tapOn: "English"
- extendedWaitUntil:
    visible:
      id: "reader-language"
    timeout: 15000
- tapOn:
    point: "50%,60%"
- extendedWaitUntil:
    visible: "Back to the service"
    timeout: 30000
- assertVisible: "English"
- tapOn: "Back to the service"
- assertVisible:
    id: "reader-language"
