# Helper, not a standalone check: launches the app and opens the fixture's
# service 9001 in the reader through the scanner's manual-ID fallback. Requires
# the app to run against qa/design-system/mock-reader-server.cjs (see README).
# Session ID entry is the scanner's fallback; a simulator has no camera to scan with.
appId: app.tarkman
---
- runFlow: launch.yaml
- tapOn:
    id: "today-scan"
- tapOn:
    id: "scan-session-id"
# Android autoFocus opens the keyboard and can occlude the already-focused field.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "session-id"
- inputText: "9001"
# Keep iOS's existing keyboard submission. Android IMEs may expose only an icon.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn: "Open session"
- extendedWaitUntil:
    visible: "All services"
    timeout: 30000
- waitForAnimationToEnd
